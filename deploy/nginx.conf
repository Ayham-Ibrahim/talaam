# Nginx config for serving the TAALAM production build (Vite SPA).
#
# HOW TO USE:
# 1. Build the app:      npm run build      → produces dist/
# 2. Copy dist/ to the server, e.g.          /var/www/taalam/dist
# 3. Replace YOUR_DOMAIN below with your real domain.
# 4. Save this file as /etc/nginx/sites-available/taalam,
#    then:  sudo ln -s /etc/nginx/sites-available/taalam /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# (Add your own TLS/SSL server block, e.g. via certbot, on top of this —
#  this file only covers static-file serving + caching.)

server {
    listen 80;
    server_name YOUR_DOMAIN;

    root /var/www/taalam/dist;
    index index.html;

    # Gzip (Brotli is better if the ngx_brotli module is installed — swap in
    # `brotli on; brotli_types ...;` the same way if available on your server)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- Vite's hashed build output (dist/assets/*.js, *.css) ----
    # Filenames change whenever content changes (e.g. index-CXro2lFy.js), so
    # it's always safe to cache these for a full year and mark them immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- Static images/icons shipped from public/ ----
    # These keep the SAME filename across deploys (e.g. /logo.webp), so a
    # 1-year immutable cache means a re-uploaded image with the same name
    # won't reach visitors until their cache expires. 30 days is a safer
    # default; bump it to 31536000 + immutable once assets are hashed too,
    # or rename the file (e.g. logo-v2.webp) whenever you replace an image.
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ---- index.html: never cache ----
    # It references the hashed asset filenames above, so it must always be
    # revalidated — otherwise visitors can get a stale index.html pointing
    # at JS/CSS bundles that no longer exist after a new deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- React Router SPA fallback ----
    # Any route not matching a real file (e.g. /dashboard/sessions) falls
    # back to index.html so client-side routing can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
